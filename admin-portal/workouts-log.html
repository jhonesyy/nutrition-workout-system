<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Logs | NutriFit Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="logo">
        <h2>NutriFit</h2>
        <span>Admin Portal</span>
      </div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="users.html">Users</a>
        <a href="nutrition.html">Nutrition</a>
        <a href="meals.html">Meal Logs</a>
        <a href="exercises.html">Exercises</a>      
        <a href="workouts-log.html" class="active">Workout Logs</a>
        <a href="loyalty.html">Loyalty & Rewards</a>
        <a href="analytics.html">Analytics</a>
        <a href="gym-settings.html">Gym Settings</a>
        <a href="minigame.html">Minigame Quizzes</a>
        <a href="account.html">Account</a>
        <a href="index.html" class="logout" id="logoutBtn">Logout</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <h1>Workout Logs (All Users)</h1>
        <div class="admin-info" id="adminInfo">Admin</div>
      </header>
      <section class="content-card">
        <h2>Recent Workouts</h2>
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Email</th>
              <th>Exercise</th>
              <th>Sets</th>
              <th>Reps</th>
              <th>Weight</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <tr><td colspan="7">Loading...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script>
    const API = 'https://nutrition-workout-system-production.up.railway.app/api';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user || !['admin','super_admin','gym_manager'].includes(user.role)) {
      window.location.href = 'index.html';
    }
    document.getElementById('adminInfo').textContent = (user.full_name || user.email) + ' | ' + user.role;
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.clear();
      window.location.href = 'index.html';
    });

    async function loadLogs() {
      const tbody = document.getElementById('logsBody');
      try {
        const res = await fetch(API + '/workouts/admin/logs?limit=50', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        const list = data.logs || [];
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="7">No workout logs yet</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(l => `
          <tr>
            <td>${l.full_name || '-'}</td>
            <td>${l.email || '-'}</td>
            <td>${l.exercise_name || l.exercise_id || '-'}</td>
            <td>${l.sets_completed ?? '-'}</td>
            <td>${l.reps_completed ?? '-'}</td>
            <td>${l.weight_kg != null ? l.weight_kg + ' kg' : '-'}</td>
            <td>${l.log_date || (l.created_at ? new Date(l.created_at).toLocaleDateString() : '-')}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="color:#c62828;">${err.message}</td></tr>`;
      }
    }
    loadLogs();
  </script>
</body>
</html>
