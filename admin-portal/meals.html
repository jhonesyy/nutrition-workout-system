<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Logs | NutriFit Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="logo">
        <h2>NutriFit</h2>
        <span>Admin Portal</span>
      </div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="users.html">Users</a>
        <a href="nutrition.html">Nutrition</a>
        <a href="meals.html" class="active">Meal Logs</a>
        <a href="exercises.html">Exercises</a>
        <a href="workouts-log.html">Workout Logs</a>
        <a href="loyalty.html">Loyalty & Rewards</a>
        <a href="analytics.html">Analytics</a>
        <a href="gym-settings.html">Gym Settings</a>
        <a href="minigame.html">Minigame Quizzes</a>
        <a href="account.html">Account</a>
        <a href="index.html" class="logout" id="logoutBtn">Logout</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <h1>Meal Logs (All Users)</h1>
        <div class="admin-info" id="adminInfo">Admin</div>
      </header>
      <section class="content-card">
        <div class="form-row" style="margin-bottom:12px;">
          <input type="date" id="filterDate" />
          <button class="btn btn-dark" id="filterBtn">Filter by date</button>
          <button class="btn" id="clearFilterBtn">Show all</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Food</th>
              <th>Meal</th>
              <th>Qty</th>
              <th>Cal</th>
              <th>P/C/F</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="mealsBody">
            <tr><td colspan="7">Loading...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>
  <script>
    const API = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user || !['admin','super_admin','gym_manager'].includes(user.role)) {
      window.location.href = 'index.html';
    }
    document.getElementById('adminInfo').textContent = (user.full_name || user.email) + ' | ' + user.role;
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.clear();
      window.location.href = 'index.html';
    });

    async function loadMeals(date) {
      const tbody = document.getElementById('mealsBody');
      try {
        const url = date
          ? `${API}/meals/admin/logs?date=${date}`
          : `${API}/meals/admin/logs?limit=50`;
        const res = await fetch(url, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        const list = data.logs || [];
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="7">No meal logs yet</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(m => `
          <tr>
            <td>${m.full_name || m.email || '-'}</td>
            <td>${m.food_name || m.food_id || '-'}</td>
            <td>${m.meal_type || '-'}</td>
            <td>${m.quantity ?? '-'}</td>
            <td>${m.calories ?? '-'}</td>
            <td>${m.protein_g ?? 0}/${m.carbs_g ?? 0}/${m.fat_g ?? 0}</td>
            <td>${m.log_date || '-'}</td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="color:#c62828;">${err.message}</td></tr>`;
      }
    }

    document.getElementById('filterBtn').addEventListener('click', () => {
      loadMeals(document.getElementById('filterDate').value || null);
    });
    document.getElementById('clearFilterBtn').addEventListener('click', () => {
      document.getElementById('filterDate').value = '';
      loadMeals();
    });

    loadMeals();
  </script>
</body>
</html>
