<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users | NutriFit Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="logo">
        <h2>NutriFit</h2>
        <span>Admin Portal</span>
      </div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="users.html" class="active">Users</a>
        <a href="nutrition.html">Nutrition</a>
        <a href="meals.html">Meal Logs</a>
        <a href="exercises.html">Exercises</a>
        <a href="workouts-log.html">Workout Logs</a>
        <a href="loyalty.html">Loyalty & Rewards</a>
        <a href="analytics.html">Analytics</a>
        <a href="gym-settings.html">Gym Settings</a>
        <a href="minigame.html">Minigame Quizzes</a>
        <a href="account.html">Account</a>
        <a href="index.html" class="logout" id="logoutBtn">Logout</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <h1>User Management</h1>
        <div class="admin-info" id="adminInfo">Admin</div>
      </header>

      <section class="content-card">
        <h2>Create Staff Account</h2>
        <form id="staffForm">
          <div class="form-row">
            <input type="text" id="staff_full_name" placeholder="Full name" required />
            <input type="email" id="staff_email" placeholder="Email" required />
            <input type="password" id="staff_password" placeholder="Password" required />
            <select id="staff_role" required>
              <option value="">Select role</option>
              <option value="admin">Admin</option>
              <option value="gym_manager">Gym Manager</option>
            </select>
            <button type="submit" class="btn btn-dark">Create</button>
          </div>
        </form>
        <p id="staffMsg" style="margin-top:8px;font-size:13px;"></p>
      </section>

      <section class="content-card">
        <h2>All Users</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Full Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="6">Loading...</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script>
    const API = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    if (!token || !user || !['admin','super_admin','gym_manager'].includes(user.role)) {
      window.location.href = 'index.html';
    }
    document.getElementById('adminInfo').textContent = (user.full_name || user.email) + ' | ' + user.role;

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.clear();
      window.location.href = 'index.html';
    });

    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    async function loadUsers() {
      const tbody = document.getElementById('usersTableBody');
      try {
        const res = await fetch(API + '/users', { headers: authHeaders() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to load users');

        const users = data.users || data;
        if (!users.length) {
          tbody.innerHTML = '<tr><td colspan="6">No users found</td></tr>';
          return;
        }

        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.full_name || '-'}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
            <td><span class="badge ${u.is_active ? 'success' : ''}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
            <td>
              ${u.id !== user.id ? `
                <button class="btn" onclick="toggleStatus(${u.id}, ${!u.is_active})">
                  ${u.is_active ? 'Deactivate' : 'Activate'}
                </button>
              ` : '<span style="color:#888;font-size:12px;">You</span>'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:#c62828;">${err.message}</td></tr>`;
      }
    }

    window.toggleStatus = async function(id, is_active) {
      if (!confirm(is_active ? 'Activate this user?' : 'Deactivate this user?')) return;
      try {
        const res = await fetch(`${API}/users/${id}/status`, {
          method: 'PATCH',
          headers: authHeaders(),
          body: JSON.stringify({ is_active })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        loadUsers();
      } catch (err) {
        alert(err.message);
      }
    };

    document.getElementById('staffForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('staffMsg');
      msg.textContent = '';
      try {
        const res = await fetch(API + '/users/staff', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            full_name: document.getElementById('staff_full_name').value.trim(),
            email: document.getElementById('staff_email').value.trim(),
            password: document.getElementById('staff_password').value,
            role: document.getElementById('staff_role').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed');
        msg.style.color = '#2e7d32';
        msg.textContent = 'Staff account created';
        e.target.reset();
        loadUsers();
      } catch (err) {
        msg.style.color = '#c62828';
        msg.textContent = err.message;
      }
    });

    loadUsers();
  </script>
</body>
</html>
