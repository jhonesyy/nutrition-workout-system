<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | NutriFit Member</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <main class="main">
      <div class="topbar">
        <h1>Dashboard</h1>
        <div id="userChip" class="muted">Member</div>
      </div>

      <div class="grid">
        <div class="card">
          <h3>Calories Target</h3>
          <div class="stat-value" id="statCalories">â€”</div>
        </div>
        <div class="card">
          <h3>Steps Today</h3>
          <div class="stat-value" id="statSteps">â€”</div>
        </div>
        <div class="card">
          <h3>Active kcal</h3>
          <div class="stat-value" id="statActive">â€”</div>
        </div>
        <div class="card">
          <h3>Loyalty pts</h3>
          <div class="stat-value" id="statLoyalty">â€”</div>
        </div>
      </div>

      <div class="card">
        <h2>Today's Nutrition</h2>
        <div class="muted" id="nutritionStatus">Loading...</div>
        <div class="progress"><span id="barCalories" style="width:0%"></span></div>
        <div class="muted" id="nutritionText">â€”</div>
      </div>

      <div class="card">
        <h2>Health Sync Status</h2>
        <p class="muted">
          Activity tracking is manual. Enter your daily steps and active calories
          on the <a href="health.html">Health Sync</a> page.
        </p>
        <div class="stat-value" id="syncStatus" style="font-size:1.2rem; margin-top:8px;">Manual entry available</div>
      </div>
    </main>
  </div>

  <script src="api.js"></script>
  <script src="nav.js"></script>
  <script>
    // Inject sidebar and set user chip
    bootShell('dashboard.html');

    function setText(id, val) {
      const el = document.getElementById(id);
      if (el) el.textContent = val ?? 'â€”';
    }

    async function loadDashboard() {
      // 1. Profile / TDEE (calories target)
      try {
        const tdee = await apiGet('/users/tdee');
        const target = tdee?.calculations?.target_calories ?? tdee?.target_calories ?? tdee?.tdee;
        setText('statCalories', target ? Math.round(target) : 'â€”');
      } catch { 
        setText('statCalories', 'â€”'); 
      }

      // 2. Loyalty points
      try {
        const loyalty = await apiGet('/loyalty/points');
        setText('statLoyalty', loyalty?.total_points ?? loyalty?.points ?? 'â€”');
      } catch { 
        setText('statLoyalty', 'â€”'); 
      }

      // 3. Today's meals (nutrition) - FIXED: reads 'consumed' and 'targets' objects
      try {
        const summary = await apiGet('/meals/summary') || {};
        const consumed = summary.consumed || {};
        const targets = summary.targets || {};
        
        const cal = consumed.calories ?? 0;
        const p = consumed.protein_g ?? 0;
        const c = consumed.carbs_g ?? 0;
        const f = consumed.fat_g ?? 0;
        
        document.getElementById('nutritionStatus').textContent = 'Meals logged today';
        document.getElementById('nutritionText').textContent = 
          `${Math.round(cal)} kcal  |  P ${Math.round(p)}g  |  C ${Math.round(c)}g  |  F ${Math.round(f)}g`;
        
        const target = Number(targets.calories) || 2000;
        const pct = target ? Math.min(100, Math.round((cal / target) * 100)) : 0;
        document.getElementById('barCalories').style.width = pct + '%';
      } catch (e) {
        console.error('Nutrition summary error:', e);
        document.getElementById('nutritionStatus').textContent = 'Could not load nutrition';
      }

      // 4. Today's health activity
      try {
        const activity = await apiGet('/health/today') || {};
        setText('statSteps', Number(activity.steps) || 0);
        setText('statActive', Number(activity.active_calories) || 0);
      } catch (error) {
        console.error('Health activity error:', error);
        setText('statSteps', 0);
        setText('statActive', 0);
      }
    }

    async function startDashboard() {
      try {
        const nextStep = await getOnboardingNextStep();

        if (nextStep) {
          window.location.replace(nextStep);
          return;
        }

        loadDashboard();
      } catch (error) {
        console.error('Onboarding check error:', error);
        loadDashboard();
      }
    }

    startDashboard();
  </script>
</body>
</html>
