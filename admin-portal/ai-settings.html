<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Settings - Admin Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ai-settings.css">
</head>
<body>
  <header class="admin-header">
    <h1>AI Provider Management</h1>
    <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
  </header>

  <main class="admin-content">
    <!-- Metrics Section -->
    <section class="metrics-section">
      <h2>Provider Performance Metrics</h2>
      <div class="metrics-grid" id="metrics-grid">
        <p>Loading metrics...</p>
      </div>
    </section>

    <!-- Configuration Section -->
    <section class="config-section">
      <h2>AI Configuration</h2>
      <form id="ai-config-form">
        <div class="form-group">
          <label for="default-provider">Default AI Provider (Fallback)</label>
          <select id="default-provider" name="default_provider">
            <option value="custom">Custom Trained AI (Local)</option>
            <option value="groq">Groq (Ultra-Fast)</option>
            <option value="gemini">Google Gemini (Advanced)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Enabled Providers</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="enabled_providers" value="custom" checked> Custom Trained AI</label>
            <label><input type="checkbox" name="enabled_providers" value="groq" checked> Groq</label>
            <label><input type="checkbox" name="enabled_providers" value="gemini" checked> Google Gemini</label>
          </div>
          <small style="color: #666; display: block; margin-top: 5px;">Unchecking a provider will disable it for all users. API keys must still be configured in the backend environment variables.</small>
        </div>

        <button type="submit" class="save-btn">Save Configuration</button>
        <p id="config-message" class="message"></p>
      </form>
    </section>
  </main>

  <script src="ai-settings.js"></script>
</body>
</html>
